server {
  listen 80;
  server_name matrix.wrytte.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name matrix.wrytte.com;

  ssl_certificate /etc/letsencrypt/live/matrix.wrytte.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/matrix.wrytte.com/privkey.pem;

  client_max_body_size 100m;

  location /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*";
    return 200 '{"m.homeserver":{"base_url":"https://matrix.wrytte.com"}}';
  }

  location /.well-known/matrix/server {
    default_type application/json;
    return 200 '{"m.server":"matrix.wrytte.com:443"}';
  }

  location /_matrix/ {
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }

  location /_dendrite/ {
    proxy_pass http://127.0.0.1:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
