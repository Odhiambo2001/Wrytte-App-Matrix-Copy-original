    sdk: flutter
  pro_video_editor: ^2.13.2
  visibility_detector: ^0.4.0+2
  vibration: ^3.1.3

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_statusbarcolor_ns: ^0.6.0
  font_awesome_flutter: ^10.9.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.0
  flutter_svg: ^2.2.0
  go_router: ^18.0.1
  material_ui: 1.2.0
  flutter_slidable: ^4.0.3
  image_picker: ^1.2.0
  file_picker: ^10.3.10
  open_filex: ^4.7.0
  archive: ^4.0.7
  pdfx: ^2.9.2
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.2
  clipboard: ^2.0.2
  flutter_contacts: ^1.1.9+2
  permission_handler: ^12.0.1
  pro_image_editor: ^14.3.0
  provider: ^6.1.5+1
  phone_numbers_parser: ^9.0.24
  flutter_libphonenumber: ^2.5.1
  libphonenumber_plugin: ^0.3.3
  device_info_plus: ^12.3.0
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  file: ^7.0.1
  flutter_sound: 9.28.0
  flutter_webrtc: ^1.2.1
  livekit_client: ^2.11.0
  # Used directly by Matrix's WebRTCDelegate contract.
  webrtc_interface: ^1.3.0
  camera: ^0.11.3
  flutter_onnxruntime: ^1.8.3
  image: ^4.8.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  ffi: ^2.1.4
  flutter_secure_storage: ^10.0.0
  photo_manager: 3.12.0
  photo_manager_image_provider: ^2.2.0
  opencv_dart:
    path: third_party/opencv_dart

dependency_overrides:
  # Retains CameraPreview while allowing the Android analyzer to run
  # RetinaFace before pixels are serialized into Dart.
  camera_android_camerax:
    path: third_party/camera_android_camerax
  rxdart: ^0.28.0
  http: ^1.6.0
  http_parser: ^4.1.2
  web_socket_channel: ^3.0.3
  equatable: ^2.0.8
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.3.1
  flutter_native_splash: ^2.4.7
  sqflite: ^2.4.2
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  matrix: ^7.1.2
  flutter_ringtone_player: ^4.0.0+4
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - core
        - imgproc
      exclude_modules:
        - calib3d
        - contrib
        - dnn
        - features2d
        - flann
        - freetype
        - highgui
        - imgcodecs
        - objdetect
        - photo
        - stitching
        - video
        - videoio

# ── App icon ──────────────────────────────────────────────────────────────────
# Run: dart run flutter_launcher_icons
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/wrytte_launcher_icon.png"
  # Android adaptive icon — canonical TT mark, centered on the dark background
  adaptive_icon_background: "#08090B"
  adaptive_icon_foreground: "assets/images/wrytte_launcher_foreground.png"
  # Remove the white background on iOS
  remove_alpha_ios: true
  # Web (optional — safe to leave in)
  web:
    generate: false

# ── Splash screen ─────────────────────────────────────────────────────────────
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  # Background colour matching your app dark background
  color: "#08090B"
  # No static logo: StartupScreen displays the animated logo after Flutter loads.
  # Keep the splash until Flutter is ready (removes white flash)
  fullscreen: true
  android_12:
    # Android 12+ uses a dedicated splash API
    color: "#08090B"
    # Transparent artwork suppresses Android 12's default launcher icon splash.
    image: assets/images/transparent_splash.png
    icon_background_color: "#08090B"
  # Make both system bars transparent on the splash too
  android_gravity: center
  ios_content_mode: center

# ── Flutter ───────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/models/retinaface_mv2.onnx
    - assets/models/retinaface_mv2.tflite
