    - assets/svg/chat_icon.svg
    - assets/svg/phonebook.svg
    - assets/svg/solar--phone-linear.svg
    - assets/svg/ic--round-arrow-back-ios.svg
    - assets/svg/Camera icon .svg
    - assets/svg/Flash off icon.svg
    - assets/svg/Flash on icon .svg
